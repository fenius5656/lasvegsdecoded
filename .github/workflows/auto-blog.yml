name: Auto-generate blog posts

# When new long-form videos appear, write a rich blog post for each (from the
# matching Drive script) and publish it directly — no review. GitHub Pages
# redeploys automatically.

on:
  schedule:
    - cron: "30 15 * * *"   # once a day, 30 min after a video sync window
  workflow_dispatch: {}       # run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate posts from new videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          VD_MODEL: ${{ vars.VD_MODEL }}
          VD_MAX_POSTS: ${{ vars.VD_MAX_POSTS }}
        run: python scripts/generate_posts.py

      - name: Publish new posts (commit directly to main)
        run: |
          git config user.name "vegas-decoded-bot"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n "$(git status --porcelain posts data/posts.json)" ]]; then
            git add posts data/posts.json
            git commit -m "Auto-publish blog post(s) from new video(s)"
            git push
          else
            echo "No new posts to publish."
          fi
